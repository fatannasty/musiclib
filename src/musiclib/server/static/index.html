<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musiclib</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root {
  --bg: #100d16; --panel: rgba(28, 22, 40, .88); --panel2: #251f35; --border: #3a314c;
  --text: #f4eefc; --dim: #b3a6c7; --accent: #ff8a4c; --accent2: #7cf0c4;
  --green: #7cf0c4; --red: #ff6b8a; --yellow: #ffd166;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow: 0 18px 40px rgba(0,0,0,.28);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 500px at -10% -20%, rgba(255,138,76,.18), transparent 55%),
    radial-gradient(900px 400px at 110% 0%, rgba(124,240,196,.12), transparent 50%),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 "Segoe UI", "Avenir Next", sans-serif;
  min-height: 100vh;
}
header { padding: 22px 24px 14px; }
.brand { display: flex; gap: 10px; align-items: center; }
.brand img { width: 34px; height: 34px; filter: drop-shadow(0 6px 12px rgba(255,138,76,.35)); }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
h1 span { color: var(--accent); }
.sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }
.chip {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; min-width: 0; box-shadow: var(--shadow);
  animation: rise .5s ease both;
}
.chip:nth-child(2) { animation-delay: .04s; } .chip:nth-child(3) { animation-delay: .08s; }
.chip:nth-child(4) { animation-delay: .12s; } .chip:nth-child(5) { animation-delay: .16s; }
.chip b { display: block; font-size: 20px; font-family: var(--mono); }
.chip small { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .6px; }
nav { display: flex; gap: 4px; padding: 8px 24px 14px; flex-wrap: wrap; }
nav button {
  background: transparent; border: 1px solid transparent; color: var(--dim);
  padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; transition: .2s ease;
}
nav button:hover { color: var(--text); background: rgba(255,255,255,.04); }
nav button.active { color: #1a1220; background: var(--accent); border-color: transparent; font-weight: 600; }
main { padding: 8px 24px 32px; max-width: 1240px; margin: 0 auto; }
section { display: none; animation: rise .35s ease; }
section.active { display: block; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
button.action {
  background: linear-gradient(180deg, #ff9a63, var(--accent)); color: #1a1220; border: none;
  padding: 9px 16px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 650;
  box-shadow: 0 8px 18px rgba(255,138,76,.25); transition: transform .15s ease, filter .15s ease;
}
button.action:hover { filter: brightness(1.08); transform: translateY(-1px); }
button.action.danger { background: var(--red); color: #fff; box-shadow: none; }
button.action.ghost { background: var(--panel); border: 1px solid var(--border); color: var(--text); box-shadow: none; }
input[type=text], input[type=search], input[type=number] {
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  padding: 9px 12px; border-radius: 12px; font-size: 13px; min-width: 320px;
}
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel2); }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.mono { font-family: var(--mono); font-size: 12px; }
td.path { font-family: var(--mono); font-size: 11.5px; color: var(--dim); word-break: break-all; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; }
.tag.ok { background: rgba(124,240,196,.15); color: var(--green); }
.tag.bad { background: rgba(255,107,138,.15); color: var(--red); }
.tag.warn { background: rgba(255,209,102,.15); color: var(--yellow); }
.tag.dim { background: rgba(179,166,199,.15); color: var(--dim); }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.card h3 { font-size: 15px; margin-bottom: 6px; }
.card p { color: var(--dim); font-size: 13px; }
.empty { color: var(--dim); padding: 30px; text-align: center; }
#toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; display: none; max-width: 420px; z-index: 99; }
#toast.err { border-color: var(--red); }
.group { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.group .head { background: var(--panel2); padding: 8px 12px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.group table { border: none; border-radius: 0; }
label.check { color: var(--dim); font-size: 13px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
select { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 12px; }
.hint { color: var(--dim); font-size: 12px; }
.keep-flag { color: var(--green); font-weight: 600; }
button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.activity {
  margin: 0 24px 16px; padding: 14px 16px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow);
}
.activity progress { width: 100%; height: 10px; accent-color: var(--accent); }
.activity .path { overflow-wrap: anywhere; color: var(--dim); }
.table-scroll { overflow-x: auto; margin-bottom: 12px; }
.pager { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
.widgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 8px 0 16px; }
.widget {
  text-align: left; cursor: pointer; border: 1px solid var(--border); background: var(--panel);
  border-radius: var(--radius); padding: 16px; color: var(--text); box-shadow: var(--shadow);
  transition: transform .18s ease, border-color .18s ease;
}
.widget:hover { transform: translateY(-3px); border-color: var(--accent); }
.widget .icon { font-size: 22px; margin-bottom: 8px; }
.widget b { display: block; font-size: 22px; font-family: var(--mono); }
.widget span { color: var(--dim); font-size: 12px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
.step { background: var(--panel2); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--dim); }
.step b { display: block; color: var(--text); margin-bottom: 2px; }
.match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin: 12px 0; }
.match-card {
  display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--border);
  border-radius: 14px; background: var(--panel2); cursor: pointer; position: relative;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.match-card:hover { transform: translateY(-3px); }
.match-card:has(input:checked), .match-card.selected {
  border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,138,76,.35);
}
.match-card input { position: absolute; opacity: 0; }
.cover, .cover-ph {
  width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #1a1524;
  display: grid; place-items: center; color: var(--accent); font-size: 28px;
}
.match-card strong { font-size: 13px; line-height: 1.3; }
.match-card em { font-style: normal; color: var(--dim); font-size: 12px; }
button.match-card { width: 100%; color: inherit; font: inherit; text-align: left; }
.album-hero { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; margin-bottom: 12px; }
.album-hero .cover, .album-hero .cover-ph { width: 140px; }
.metadata-field { display: grid; grid-template-columns: minmax(100px, .7fr) 1fr 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.metadata-field:last-child { border-bottom: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 600px) {
  main { padding: 12px; }
  input[type=text], input[type=search], input[type=number] { min-width: 0; max-width: 100%; }
  .metadata-field { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/favicon.svg" alt=""><h1>music<span>lib</span></h1></div>
  <div class="sub" id="dbpath">dashboard</div>
  <div class="chips" id="chips"></div>
</header>
<nav id="nav"></nav>
<aside class="activity" aria-label="Library activity">
  <h2 style="font-size:15px">Activity</h2>
  <div id="activity-current" role="status" aria-live="polite">Loading activity...</div>
  <details><summary>Job history and results</summary><div id="activity-history"></div></details>
  <div id="activity-results"></div>
</aside>
<main id="main"></main>
<div id="toast"></div>
<script>
const TABS = [
  ["overview", "Overview"], ["dupes", "Duplicates"], ["doctor", "Bad Files"],
  ["library", "Library"], ["recovery", "Recovery"],
  ["organize", "Organize"], ["art", "Cover Art"], ["missing", "Missing Music"],
  ["usenet", "Usenet"], ["settings", "Settings"],
];
const state = { tab: "overview", jobs: [], libraryView: "albums" };
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes = (b) => {
  if (b == null) return "-";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (b >= 1024 && i < 4) { b /= 1024; i++; }
  return b.toFixed(1) + u[i];
};
const fmtDur = (s) => {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? `${h}h ${m}m` : `${m}m`;
};
function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000);
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}
async function post(path, body) {
  return api(path, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {}) });
}
async function pollJob(id, label) {
  toast(`${label}: running...`);
  while (true) {
    const job = await api(`/api/jobs/${id}`);
    if (job.status === "done") { await refreshActivity(); toast(`${label}: done`); return job; }
    if (job.status === "error") { await refreshActivity(); throw new Error(job.error); }
    await new Promise(r => setTimeout(r, 1500));
  }
}

window.addEventListener("unhandledrejection", event => {
  toast(event.reason?.message || String(event.reason), true);
});
const latestJob = kind => state.jobs.find(j => j.kind === kind && j.status === "done");
const elapsed = job => {
  const seconds = Math.max(0, Math.floor((job.finished || Date.now() / 1000) - job.started));
  return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
};
async function pagedTable(container, load, headers, row, onPage = () => {}) {
  let offset = 0;
  const draw = async () => {
    try {
      const page = await load(offset);
      if (!container.isConnected) return;
      container.innerHTML = `<div class="table-scroll"><table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${page.items.map(row).join("")}</tbody></table></div>
        <div class="pager"><button class="action ghost prev" ${offset === 0 ? "disabled" : ""}>Previous</button>
        <span>${page.total ? offset + 1 : 0}–${Math.min(offset + page.items.length, page.total)} of ${page.total}</span>
        <button class="action ghost next" ${offset + page.items.length >= page.total ? "disabled" : ""}>Next</button></div>`;
      container.querySelector(".prev").onclick = () => { offset = Math.max(0, offset - 50); draw(); };
      container.querySelector(".next").onclick = () => { offset += 50; draw(); };
      onPage(page.items);
    } catch (e) { container.textContent = e.message; toast(e.message, true); }
  };
  await draw();
}
async function showJobResults(job) {
  const container = $("#activity-results");
  container.innerHTML = `<h3>${esc(job.kind)} results</h3><div class="row sections"></div><div class="results-page"></div>`;
  const sections = Object.entries(job.summary || {}).filter(([, value]) => typeof value === "number");
  const lists = {
    scan: [], doctor: ["results", "failures"], duplicates: ["groups"],
    rename: ["moves", "skipped_files", "errors"], art: ["albums"], "duplicates-apply": [],
    "metadata-lookup": ["reviews", "errors"], "metadata-apply": ["applied", "errors"],
    "issues-trash": ["failures"], "album-apply": ["applied", "errors", "rename_errors"],
  }[job.kind] || [];
  container.querySelector(".sections").innerHTML = sections.map(([key, value]) => `<span class="tag dim">${esc(key)}: ${value}</span>`).join("") +
    lists.map(key => `<button class="action ghost" data-section="${key}">${esc(key)}</button>`).join("");
  container.querySelectorAll("[data-section]").forEach(button => button.onclick = () => {
    pagedTable(container.querySelector(".results-page"),
      offset => api(`/api/jobs/${job.id}/results/${button.dataset.section}?offset=${offset}`),
      ["Result"], item => `<tr><td class="path">${esc(JSON.stringify(item, null, 2))}</td></tr>`);
  });
  if (job.kind === "metadata-lookup") {
    const button = document.createElement("button");
    button.className = "action ghost";
    button.textContent = "Review suggestions";
    button.onclick = () => { state.metadataLookupJob = job.id; state.tab = "library"; render(); };
    container.querySelector(".sections").append(button);
  }
  container.querySelector("[data-section]")?.click();
}
async function refreshActivity() {
  try {
    state.jobs = await api("/api/jobs");
    const active = state.jobs.find(j => ["queued", "running"].includes(j.status));
    $("#activity-current").innerHTML = active ? `
      <p><b>${esc(active.kind)}: ${esc(active.phase)}</b> · ${elapsed(active)}</p>
      <progress ${active.total !== null ? `value="${active.completed}" max="${Math.max(1, active.total)}"` : ""}></progress>
      <p>${active.total !== null ? `${active.completed} / ${active.total} processed` : "Working — total not yet known"}</p>
      <p class="path">${esc(active.current)}</p>` : "<p>No library operation running.</p>";
    document.querySelectorAll("[data-operation]").forEach(button => { button.disabled = !!active; });
    const history = $("#activity-history");
    if (history.dataset.jobs !== JSON.stringify(state.jobs.map(j => [j.id, j.status]))) {
      history.dataset.jobs = JSON.stringify(state.jobs.map(j => [j.id, j.status]));
      await pagedTable(history,
        async offset => ({ items: state.jobs.slice(offset, offset + 50), total: state.jobs.length }),
        ["Task", "Status", "Elapsed", "Result"],
        job => `<tr><td>${esc(job.kind)}</td><td>${esc(job.status)}</td><td>${elapsed(job)}</td><td>${job.error ? esc(job.error) :
          job.status === "done" ? `<button class="action ghost" data-result="${job.id}">View results</button>` : "In progress"}</td></tr>`,
        () => history.querySelectorAll("[data-result]").forEach(button => {
          button.onclick = () => showJobResults(state.jobs.find(j => j.id === button.dataset.result));
        }));
    }
  } catch (e) { $("#activity-current").textContent = `Cannot refresh activity: ${e.message}`; }
}
async function runTask(kind, body) {
  const { job_id } = await post(`/api/tasks/${kind}`, body);
  await refreshActivity();
  return pollJob(job_id, kind);
}

async function loadStats() {
  const s = await api("/api/stats");
  const chips = [
    [s.tracks.toLocaleString(), "tracks"], [s.albums.toLocaleString(), "albums"],
    [fmtBytes(s.bytes), "size"], [fmtDur(s.duration_seconds), "duration"],
    [s.dupe_groups, "dupe groups"], [s.issues, "issues"],
    [s.albums_missing_art, "missing art"], [s.albums_missing_tracks, "incomplete albums"],
  ];
  $("#chips").innerHTML = chips.map(([v, l]) => `<div class="chip"><b>${esc(v)}</b><small>${l}</small></div>`).join("");
  return s;
}

const views = {
  async overview(el) {
    const s = await loadStats();
    el.innerHTML = `
      <div class="widgets">
        <button class="widget" data-go="library"><div class="icon">♪</div><b>${esc(s.tracks.toLocaleString())}</b><span>Tracks in catalog</span></button>
        <button class="widget" data-go="doctor"><div class="icon">⚠</div><b>${esc(s.issues)}</b><span>Issues to review</span></button>
        <button class="widget" data-go="dupes"><div class="icon">⧉</div><b>${esc(s.dupe_groups)}</b><span>Duplicate groups</span></button>
        <button class="widget" data-go="art"><div class="icon">▣</div><b>${esc(s.albums_missing_art)}</b><span>Albums missing art</span></button>
        <button class="widget" data-go="missing"><div class="icon">…</div><b>${esc(s.albums_missing_tracks)}</b><span>Incomplete albums</span></button>
      </div>
      <div class="row">
        <button class="action" id="btn-scan" data-operation>Scan library</button>
        <label class="check"><input type="checkbox" id="opt-rescan"> re-read all file metadata</label>
        <button class="action ghost" id="btn-refresh">Refresh stats</button>
      </div>
      <div class="card"><h3>Recommended workflow</h3>
        <div class="steps">
          <div class="step"><b>1. Scan</b> Catalog files</div>
          <div class="step"><b>2. Bad files</b> Trash broken audio</div>
          <div class="step"><b>3. Duplicates</b> Keep the best copy</div>
          <div class="step"><b>4. Organize</b> Rename into folders</div>
          <div class="step"><b>5. Cover art</b> Fetch missing art</div>
          <div class="step"><b>6. Missing</b> Find album gaps</div>
          <div class="step"><b>7. Usenet</b> Fill from indexers</div>
        </div>
        <p style="margin-top:10px">Destructive actions ask for confirmation and default to trash (recoverable).</p></div>
      <div id="overview-lists"></div>`;
    el.querySelectorAll("[data-go]").forEach(button => button.onclick = () => {
      state.tab = button.dataset.go; render();
    });
    $("#btn-scan").onclick = async () => {
      const { job_id } = await post("/api/scan", { rescan: $("#opt-rescan").checked });
      await refreshActivity();
      await pollJob(job_id, "Scan");
      if (el.isConnected) await render();
    };
    $("#btn-refresh").onclick = render;
    const lists = $("#overview-lists");
    await pagedTable(lists, offset => api(`/api/issues/page?offset=${offset}`),
      ["Severity", "Kind", "Details", "File"],
      i => `<tr><td>${esc(i.severity)}</td><td>${esc(i.kind)}</td><td>${esc(i.detail)}</td><td class="path">${esc(i.path)}</td></tr>`);
  },

  async dupes(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-find" data-operation>Find duplicates</button>
      <button class="action danger" id="btn-apply" data-operation style="display:none">Trash copies in selected groups</button>
      <label class="check"><input type="checkbox" id="opt-fingerprint"> compare audio fingerprints (slower)</label>
      <span class="hint">Select groups to approve removal, then choose the keeper. Unselected groups are untouched.</span>
    </div><div id="dupe-list"><div class="empty">Click "Find duplicates" to analyze the library.</div></div>
    <div class="card"><h3>Manual duplicate review</h3>
      <p>Search your library, add files you know are copies, choose the one to keep, then move the rest to trash.</p>
      <div class="row" style="margin-top:12px"><input type="search" id="manual-query" placeholder="Search artist, album, title, or path">
      <button class="action ghost" id="manual-search">Search</button></div>
      <div id="manual-results" class="hint"></div><div id="manual-picked"></div>
      <button class="action danger" id="manual-apply" style="display:none">Trash selected copies</button>
    </div>`;
    const reviewed = new Map();
    const drawDupes = async () => {
      await pagedTable($("#dupe-list"), offset => api(`/api/dupes/page?offset=${offset}`),
        ["Duplicate groups — select only those you have reviewed"],
        group => {
          const g = reviewed.get(group.group_id) || group;
          const keep = g.members.find(m => m.id === g.keep_id);
          return `<tr><td><div class="group" data-gid="${g.group_id}">
            <div class="head"><label><input type="checkbox" data-approve="${g.group_id}" ${reviewed.has(g.group_id) ? "checked" : ""}> Approve group</label>
            <span>${esc(keep?.artist)} — ${esc(keep?.title)} · ${g.members.length} copies</span></div>
            <table><thead><tr><th>Keep</th><th>Quality</th><th>Score</th><th>Path</th></tr></thead><tbody>${g.members.map(m =>
              `<tr><td><input aria-label="Keep ${esc(m.path)}" type="radio" name="keep-${g.group_id}" data-keep="${g.group_id}:${m.id}" ${m.id === g.keep_id ? "checked" : ""}></td>
              <td>${esc(m.format)} ${esc(m.bitrate)} kbps</td><td>${esc(m.quality_score)}</td><td class="path">${esc(m.path)}</td></tr>`
            ).join("")}</tbody></table></div></td></tr>`;
        },
        groups => {
          el.querySelectorAll("[data-approve]").forEach(node => node.onchange = () => {
            const g = groups.find(g => g.group_id === Number(node.dataset.approve));
            if (node.checked) reviewed.set(g.group_id, g); else reviewed.delete(g.group_id);
            $("#btn-apply").style.display = reviewed.size ? "" : "none";
          });
          el.querySelectorAll("[data-keep]").forEach(node => node.onchange = () => {
            const [gid, tid] = node.dataset.keep.split(":").map(Number);
            const g = reviewed.get(gid) || groups.find(g => g.group_id === gid);
            g.keep_id = tid;
          });
        });
    };
    const selected = new Map();
    let manualKeepId = null;
    const renderManual = () => {
      const picked = [...selected.values()];
      if (!picked.some(m => m.id === manualKeepId)) manualKeepId = picked[0]?.id || null;
      $("#manual-picked").innerHTML = picked.length ? `<table><thead><tr><th>keep</th><th>track</th><th>path</th><th></th></tr></thead><tbody>${
        picked.map(m => `<tr><td><input type="radio" name="manual-keep" value="${m.id}" ${m.id === manualKeepId ? "checked" : ""}></td>
          <td>${esc([m.artist, m.album, m.title].filter(Boolean).join(" — ") || "Unknown track")}</td>
          <td class="path">${esc(m.path)}</td><td><button class="action ghost" data-remove="${m.id}">Remove</button></td></tr>`).join("")
      }</tbody></table>` : "";
      $("#manual-apply").style.display = picked.length >= 2 ? "" : "none";
      el.querySelectorAll("[data-remove]").forEach(button => button.onclick = () => {
        selected.delete(Number(button.dataset.remove)); renderManual();
      });
      el.querySelectorAll('input[name="manual-keep"]').forEach(radio => {
        radio.onchange = () => { manualKeepId = Number(radio.value); };
      });

    $("#btn-find").onclick = async () => {
      await runTask("duplicates", { fingerprint: $("#opt-fingerprint").checked });
      if (!el.isConnected) return;
      reviewed.clear(); $("#btn-apply").style.display = "none"; await drawDupes();
    };
    $("#btn-apply").onclick = async () => {
      if (!reviewed.size || !confirm(`Trash copies in ${reviewed.size} selected groups? Keepers remain untouched.`)) return;
      const body = { keep_ids: {}, member_ids: {}, group_ids: [...reviewed.keys()], hard_delete: false };
      reviewed.forEach(g => { body.keep_ids[g.group_id] = g.keep_id; body.member_ids[g.group_id] = g.members.map(m => m.id); });
      const { job_id } = await post("/api/dupes/apply-job", body);
      await refreshActivity(); await pollJob(job_id, "Remove duplicates");
      if (!el.isConnected) return;
      reviewed.clear(); $("#btn-apply").style.display = "none"; await drawDupes(); await loadStats();
    };
    $("#manual-search").onclick = async () => {

        ["Track", "Genre", "Path", "Select"],
        m => `<tr><td>${esc([m.artist, m.album, m.title].filter(Boolean).join(" — ") || "Unknown track")}</td>
          <td>${esc(m.genre || "—")}</td><td class="path">${esc(m.path)}</td>
          <td><button class="action ghost" data-add="${m.id}">Add</button></td></tr>`,
        results => results.forEach(m => {
        const button = el.querySelector(`[data-add="${m.id}"]`);
        if (button) button.onclick = () => { selected.set(m.id, m); renderManual(); };
      }));
    };
    $("#manual-query").onkeydown = event => {
      if (event.key === "Enter") { event.preventDefault(); $("#manual-search").click(); }
    };
    $("#manual-apply").onclick = async () => {
      const picked = [...selected.values()];
      const keep = Number(el.querySelector('input[name="manual-keep"]:checked')?.value);
      if (!keep || !confirm(`Move ${picked.length - 1} manually selected duplicate files to trash?`)) return;
      const res = await post("/api/dupes/manual", {
        track_ids: picked.map(m => m.id), keep_id: keep, hard_delete: false,
      });
      toast(`Trashed ${res.trashed}, reclaimed ${fmtBytes(res.reclaimed_bytes)}`);
      selected.clear(); manualKeepId = null; $("#manual-results").innerHTML = ""; renderManual(); loadStats();
    };
    await drawDupes();
  },

  async doctor(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-check" data-operation>Check files</button>
      <button class="action danger" id="btn-remove" data-operation style="display:none">Trash all bad files</button>

    </div><div class="row">
      <select id="issue-severity" aria-label="Issue severity"><option value="">All severities</option><option value="bad">Bad — broken files</option><option value="warn">Warnings — review only</option></select>
      <select id="issue-kind" aria-label="Issue type"><option value="">All issue types</option><option value="decode_error">Audio corruption</option>
      <option value="unparseable">Unreadable audio</option><option value="missing_file">Missing file</option><option value="missing_tags">Missing metadata</option>
      <option value="low_bitrate">Low bitrate</option><option value="short_file">Short file</option></select>
    </div><p class="hint">Select files to trash even if a full check has not just finished. Permission errors are listed per file and do not stop the rest. Warnings are not included in Trash all bad files.</p>

    const selected = new Set();
    const updateTrashSelection = () => {
      el.querySelectorAll("[data-trash-track]").forEach(input => {
        input.checked = selected.has(Number(input.dataset.trashTrack));
      });
    };
    const showIssues = async () => {
      const severity = $("#issue-severity").value, kind = $("#issue-kind").value;
      const bad = await api("/api/issues/page?offset=0&limit=1&severity=bad");
      $("#btn-remove").style.display = bad.total ? "" : "none";
      await pagedTable($("#doc-out"),
        offset => api(`/api/issues/page?offset=${offset}&severity=${encodeURIComponent(severity)}&kind=${encodeURIComponent(kind)}`),
        ["Select", "Severity", "Issue", "Details", "File"],
        i => `<tr><td><input type="checkbox" data-trash-track="${i.track_id}" aria-label="Select ${esc(i.path)}"></td>
          <td>${esc(i.severity)}</td><td>${esc(i.kind)}</td><td>${esc(i.detail)}</td><td class="path">${esc(i.path)}</td></tr>`,
        () => {
          el.querySelectorAll("[data-trash-track]").forEach(input => input.onchange = () => {
            const id = Number(input.dataset.trashTrack);
            if (input.checked) selected.add(id); else selected.delete(id);
            updateTrashSelection();
          });
          updateTrashSelection();
        });
    };
    $("#issue-severity").onchange = showIssues;
    $("#issue-kind").onchange = showIssues;
    $("#btn-check").onclick = async () => {
      const job = await runTask("doctor", { deep: $("#opt-deep").checked });
      if (!el.isConnected) return;
      $("#doc-summary").textContent = `${job.summary.checked} checked · ${job.summary.bad} bad · ${job.summary.suspect} suspect`;
      if (!job.summary.bad) toast("No broken files found. Warnings are still available for review.");
      await showIssues(); await loadStats();
    };
    $("#btn-remove").onclick = async () => {
      if (!confirm("Recheck metadata and move all currently bad files to trash? Warnings will remain. Files that cannot be moved are reported and skipped.")) return;
      const job = await runTask("doctor", { apply: true, hard_delete: false, deep: false });
      toast(`Trashed ${job.summary.trashed} bad files` + (job.summary.failed ? `; ${job.summary.failed} could not be moved` : ""));
      if (el.isConnected) await showIssues();
      await loadStats();
    };
    $("#btn-trash-selected").onclick = async () => {
      if (!selected.size) { toast("Select files to trash first.", true); return; }
      if (!confirm(`Move ${selected.size} selected file(s) to trash? Failed files are listed and the rest continue.`)) return;
      try {
        const { job_id } = await post("/api/issues/trash", {track_ids: [...selected]});
        await refreshActivity();
        const job = await pollJob(job_id, "Trash selected files");
        const failures = await api(`/api/jobs/${job_id}/results/failures?limit=200`);
        toast(`Trashed ${job.summary.trashed}` + (job.summary.failed ? `; ${job.summary.failed} failed` : ""));
        $("#doc-summary").innerHTML = failures.items.map(item =>
          `<p role="alert">${esc(item.path || item.track_id)}: ${esc(item.error)}</p>`).join("");
        selected.clear();
        if (el.isConnected) await showIssues();
        await loadStats();
      } catch (e) { toast(e.message, true); }
    };
    await showIssues();
  },

  async library(el) {

          <label>Artist <input type="text" name="artist" value="${esc(track.artist || "")}"></label>
          <button type="submit" class="action">Search MusicBrainz</button>
        </div><p role="status" class="hint" data-search-status></p></form>`;
      const form = searchPanel.querySelector("form");
      const submit = form.querySelector('button[type="submit"]');
      const status = form.querySelector("[data-search-status]");
      form.onsubmit = async event => {
        event.preventDefault();
        const title = form.elements.namedItem("title").value.trim();
        const artist = form.elements.namedItem("artist").value.trim();
        if (!title && !artist) {
          status.textContent = "Enter at least a title or artist.";
          return;
        }
        submit.disabled = true;
        status.textContent = "Looking up MusicBrainz…";
        el.querySelector("#metadata-review").innerHTML = "";
        try {
          const review = await post("/api/metadata/lookup", {track_id: track.id, title, artist});
          if (!form.isConnected) return;
          status.textContent = "";
          renderMetadataReview(review);
        } catch (e) {
          if (form.isConnected) status.textContent = e.message;
        } finally {
          submit.disabled = false;
        }
      };
      searchPanel.scrollIntoView({behavior: "smooth", block: "start"});
    };
    const coverMarkup = candidate => {
      const src = candidate.cover_url || "";
      const fallback = candidate.cover_fallback || "";
      if (!src) return `<div class="cover-ph" aria-hidden="true">♪</div>`;
      return `<img class="cover" alt="" loading="lazy" src="${esc(src)}" data-fallback="${esc(fallback)}"
        onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback='';}else{this.replaceWith(Object.assign(document.createElement('div'),{className:'cover-ph',textContent:'♪'}));}">`;
    };
    const renderMetadataReview = (review, panel = $("#metadata-review"), onSelection = null) => {
      if (!review.candidates.length) {
        panel.innerHTML = `<div class="card"><h3>No catalog matches</h3>
          <p class="path">${esc(review.track.path)}</p><p>No suggestions were found. Existing file tags were not changed.</p></div>`;
        return;
      }
      let candidateIndex = 0;
      const renderCandidate = () => {
        const candidate = review.candidates[candidateIndex];
        const labels = {
          title: "Title", artist: "Artist", album_artist: "Album artist", album: "Album",
          year: "Year", track_no: "Track number", disc_no: "Disc number", genre: "Genre",
          mbid_track: "Recording ID", mbid_release: "Release ID",
        };
        const fields = Object.keys(labels).filter(key => candidate.fields[key] != null);
        panel.innerHTML = `<div class="card"><h3>Review metadata suggestions</h3>
          <p>Source: ${esc(candidate.source)} · confidence ${candidate.confidence}/100. Suggestions do not change your files until you select fields and apply.</p>
          <p class="path">${esc(review.track.path)}</p>
          <div class="match-grid">${review.candidates.map((item, index) =>
            `<label class="match-card ${index === candidateIndex ? "selected" : ""}">
              <input type="radio" name="metadata-candidate-${review.review_id}" value="${index}" ${index === candidateIndex ? "checked" : ""}>
              ${coverMarkup(item)}
              <strong>${esc(item.fields.title)}</strong>
              <em>${esc(item.fields.artist)} · ${esc(item.fields.album || "No album")} (${esc(item.fields.year || "—")})</em>
              <span class="tag ${item.confidence >= 90 ? "ok" : "warn"}">${esc(item.source)} · ${item.confidence}%</span>
            </label>`
          ).join("")}</div>
          <div>${fields.map(key => {
            const current = review.track[key] ?? "—";
            const suggested = candidate.fields[key];
            const differs = String(current).toLowerCase() !== String(suggested).toLowerCase();
            return `<label class="metadata-field"><span><input type="checkbox" data-metadata-field="${key}"> ${labels[key]}</span>
              <span>Current: ${esc(current)}</span><span>Suggested: ${esc(suggested)}${differs ? " (change)" : ""}</span></label>`;
          }).join("")}</div>
          <p class="hint">No fields are selected by default. Choose each change to write, then confirm before applying. Artwork is not written unless you later use Cover Art.</p>
          ${onSelection ? "" : '<button class="action" data-metadata-apply>Apply selected tags</button>'}
          <button class="action ghost" data-metadata-cancel>${onSelection ? "Skip track" : "Close"}</button></div>`;
        panel.querySelectorAll('input[type="radio"]').forEach(radio => radio.onchange = () => {
          if (onSelection) onSelection(null);
          candidateIndex = Number(radio.value); renderCandidate();
        });
        const selectedFields = () => [...panel.querySelectorAll("[data-metadata-field]:checked")]
            .map(input => input.dataset.metadataField);
        panel.querySelector("[data-metadata-cancel]").onclick = () => {
          if (onSelection) onSelection(null);
          panel.innerHTML = "";
        };
        if (onSelection) {
          panel.querySelectorAll("[data-metadata-field]").forEach(input => input.onchange = () => {
            const fields = selectedFields();
            onSelection(fields.length ? {
              review_id: review.review_id, candidate_index: candidateIndex, fields,
            } : null);
          });
          return;
        }
        panel.querySelector("[data-metadata-apply]").onclick = async () => {
          const fields = selectedFields();
          if (!fields.length) { toast("Select at least one field to apply.", true); return; }
          if (!confirm(`Apply ${fields.length} selected tag(s) to this file?`)) return;
          const applyButton = panel.querySelector("[data-metadata-apply]");
          try {
            applyButton.disabled = true;
            const result = await post("/api/metadata/apply", {
              review_id: review.review_id, candidate_index: candidateIndex, fields,
            });
            toast(`Updated ${fields.join(", ")}`);
            panel.innerHTML = `<div class="card"><h3>Tags updated</h3><p>${esc(result.path)}</p></div>`;
            await $("#library-search").onclick(); await loadStats();
          } catch (e) { toast(e.message, true); applyButton.disabled = false; }
        };
      };
      renderCandidate();
      if (!onSelection) panel.scrollIntoView({behavior: "smooth", block: "start"});
    };
    const loadBulkReview = async jobId => {
      const [reviews, errors] = await Promise.all([
        api(`/api/jobs/${jobId}/results/reviews?limit=100`),
        api(`/api/jobs/${jobId}/results/errors?limit=100`),
      ]);
      if (!el.isConnected) return;
      const panel = el.querySelector("#metadata-bulk");
      const choices = new Map();
      panel.innerHTML = `<div class="card"><h3>Bulk metadata review</h3>
        <p>Review album cards and choose fields below. Nothing is selected automatically. Files are not renamed or moved.</p>
        <p>${reviews.total} looked up; ${errors.total} lookup errors.</p>
        ${errors.items.map(item => `<p role="alert">Track ${item.track_id}: ${esc(item.error)}</p>`).join("")}
        <button class="action" data-bulk-apply data-operation>Apply reviewed tags</button>
        <span data-bulk-count>0 tracks ready</span><div data-bulk-status role="status"></div>
        <fieldset data-bulk-reviews style="border:0;padding:0"></fieldset></div>`;
      const cards = panel.querySelector("[data-bulk-reviews]");
      reviews.items.forEach(review => {
        const card = document.createElement("div");
        card.dataset.reviewId = review.review_id;
        cards.append(card);
        renderMetadataReview(review, card, selection => {
          if (selection) choices.set(review.review_id, selection);
          else choices.delete(review.review_id);
          panel.querySelector("[data-bulk-count]").textContent = `${choices.size} tracks ready`;
        });
      });
      panel.querySelector("[data-bulk-apply]").onclick = async () => {
        const selected = [...choices.values()];
        const count = selected.reduce((total, review) => total + review.fields.length, 0);
        if (!selected.length) { toast("Select fields on at least one track.", true); return; }
        if (!confirm(`Write ${count} selected tag(s) across ${selected.length} file(s)? Files are processed individually; failures will be listed.`)) return;
        const status = panel.querySelector("[data-bulk-status]");
        const button = panel.querySelector("[data-bulk-apply]");
        try {
          button.disabled = true;
          cards.disabled = true;
          const { job_id } = await post("/api/metadata/apply-bulk", {reviews: selected});
          status.textContent = "Applying reviewed tags. Progress and saved results are in Activity.";
          await refreshActivity();
          await pollJob(job_id, "Bulk tag updates");
          const [applied, failures] = await Promise.all([
            api(`/api/jobs/${job_id}/results/applied?limit=100`),
            api(`/api/jobs/${job_id}/results/errors?limit=100`),
          ]);
          if (!panel.isConnected) return;
          status.innerHTML = `<p>${applied.total} files updated; ${failures.total} failed.</p>` +
            failures.items.map(item => `<p role="alert">Review ${item.review_id}: ${esc(item.error)}</p>`).join("");
          applied.items.forEach(item => {
            choices.delete(item.review_id);
            panel.querySelector(`[data-review-id="${item.review_id}"]`).textContent = `Updated: ${item.path}`;
          });
          panel.querySelector("[data-bulk-count]").textContent = `${choices.size} tracks ready`;
          await $("#library-search").onclick(); await loadStats();
        } catch (e) { status.textContent = e.message; toast(e.message, true); }
        finally { button.disabled = false; cards.disabled = false; }
      };
    };
    const albumLabels = {
      album: "Album", album_artist: "Album artist", artist: "Artist",
      year: "Year", genre: "Genre", mbid_release: "Release ID",
    };
    $("#metadata-album-bulk").onclick = async () => {
      if (!selectedTracks.size) { toast("Select tracks to tag as one album first.", true); return; }
      const panel = el.querySelector("#metadata-album");
      const first = pageTracks.find(track => selectedTracks.has(track.id)) || {};
      panel.innerHTML = `<form class="card"><h3>Tag selected tracks as one album</h3>
        <p>Suggestions include albums already in your library, then MusicBrainz and iTunes. Nothing is written until you choose fields and confirm.</p>
        <div class="row">
          <label>Album <input type="text" name="album" value="${esc(first.album || "")}"></label>
          <label>Artist <input type="text" name="artist" value="${esc(first.album_artist || first.artist || "")}"></label>
          <button type="submit" class="action">Find album matches</button>
        </div><p role="status" class="hint" data-album-status></p>
        <div data-album-results></div></form>`;
      const form = panel.querySelector("form");
      form.onsubmit = async event => {
        event.preventDefault();
        const status = form.querySelector("[data-album-status]");
        const results = form.querySelector("[data-album-results]");
        const submit = form.querySelector('button[type="submit"]');
        submit.disabled = true;
        status.textContent = "Searching your library and catalogs…";
        results.innerHTML = "";
        try {
          const payload = await post("/api/metadata/album-suggest", {
            track_ids: [...selectedTracks],
            album: form.elements.namedItem("album").value.trim(),
            artist: form.elements.namedItem("artist").value.trim(),
          });
          if (!form.isConnected) return;
          status.textContent = `${payload.tracks.length} tracks · ${payload.suggestions.length} suggestions`;
          if (!payload.suggestions.length) {
            results.innerHTML = "<p>No album suggestions were found. File tags were not changed.</p>";
            return;
          }
          let suggestionIndex = 0;
          const draw = () => {
            const suggestion = payload.suggestions[suggestionIndex];
            const fields = Object.keys(albumLabels).filter(key => suggestion.fields[key] != null);
            results.innerHTML = `<div class="match-grid">${payload.suggestions.map((item, index) =>
              `<label class="match-card ${index === suggestionIndex ? "selected" : ""}">
                <input type="radio" name="album-suggestion" value="${index}" ${index === suggestionIndex ? "checked" : ""}>
                ${coverMarkup(item)}
                <strong>${esc(item.fields.album)}</strong>
                <em>${esc(item.fields.album_artist || item.fields.artist || "Unknown artist")} (${esc(item.fields.year || "—")})</em>
                <span class="tag ${item.source === "Your library" ? "ok" : "warn"}">${esc(item.source)}${item.in_library ? ` · ${item.in_library} tracks` : ""} · ${item.confidence}%</span>
              </label>`
            ).join("")}</div>
            <div>${fields.map(key => `<label class="metadata-field"><span><input type="checkbox" data-album-field="${key}"> ${albumLabels[key]}</span>
              <span>Suggested: ${esc(suggestion.fields[key])}</span></label>`).join("")}</div>
            <label class="check"><input type="checkbox" data-album-rename> Also rename these files using current Organize templates</label>
            <button class="action" data-album-apply data-operation>Apply album tags</button>`;
            results.querySelectorAll('input[type="radio"]').forEach(radio => radio.onchange = () => {
              suggestionIndex = Number(radio.value); draw();
            });
            results.querySelector("[data-album-apply]").onclick = async () => {
              const chosen = [...results.querySelectorAll("[data-album-field]:checked")].map(input => input.dataset.albumField);
              if (!chosen.length) { toast("Select at least one album field to apply.", true); return; }
              const rename = results.querySelector("[data-album-rename]").checked;
              if (!confirm(`Write ${chosen.length} album field(s) to ${payload.tracks.length} file(s)${rename ? " and rename them" : ""}?`)) return;
              const button = results.querySelector("[data-album-apply]");
              try {
                button.disabled = true;
                const values = {};
                chosen.forEach(key => { values[key] = suggestion.fields[key]; });
                const { job_id } = await post("/api/metadata/album-apply", {
                  track_ids: payload.tracks.map(track => track.id), fields: chosen, values, rename,
                });
                status.textContent = "Applying album tags. Progress is in Activity.";
                await refreshActivity();
                await pollJob(job_id, "Album tag update");
                const [applied, errors, renameErrors] = await Promise.all([
                  api(`/api/jobs/${job_id}/results/applied?limit=200`),
                  api(`/api/jobs/${job_id}/results/errors?limit=200`),
                  api(`/api/jobs/${job_id}/results/rename_errors?limit=200`),
                ]);
                status.innerHTML = `<p>${applied.total} files updated; ${errors.total} failed; ${renameErrors.total} rename errors.</p>` +
                  errors.items.map(item => `<p role="alert">${esc(item.path || item.track_id)}: ${esc(item.error)}</p>`).join("");
                await $("#library-search").onclick(); await loadStats();
              } catch (e) { toast(e.message, true); button.disabled = false; }
            };
          };
          draw();
        } catch (e) { status.textContent = e.message; }
        finally { submit.disabled = false; }
      };
      panel.scrollIntoView({behavior: "smooth", block: "start"});
    };
    $("#metadata-lookup-bulk").onclick = async () => {
      if (!selectedTracks.size) { toast("Select tracks to look up first.", true); return; }
      if (selectedTracks.size > 100) { toast("Per-track lookup is limited to 100 files. Use album tagging for larger groups.", true); return; }
      try {
        const { job_id } = await post("/api/metadata/lookup-bulk", {track_ids: [...selectedTracks]});
        state.metadataLookupJob = job_id;
        await refreshActivity();
        await pollJob(job_id, "Bulk catalog lookup");
        await loadBulkReview(job_id);
      } catch (e) { toast(e.message, true); }
    };
    $("#library-query").onkeydown = event => {
      if (event.key === "Enter") { event.preventDefault(); $("#library-search").click(); }
    };
    await $("#library-search").onclick();
    if (state.metadataLookupJob) {
      const job = await api(`/api/jobs/${state.metadataLookupJob}`);
      if (job.status === "done") await loadBulkReview(job.id);
    }
  },

  async recovery(el) {
    el.innerHTML = `<p class="hint">Restore trashed files to their original locations. If a location is occupied, the restore is refused rather than overwriting anything.</p>
      <label class="check"><input type="checkbox" id="show-restored"> include previously restored entries</label>
      <div id="trash-table"></div>`;
    const draw = () => pagedTable($("#trash-table"),
      offset => api(`/api/trash?offset=${offset}&include_restored=${$("#show-restored").checked}`),
      ["Deleted", "Reason", "Original path", "Restore"],
      item => `<tr><td>${esc(item.deleted_at)}</td><td>${esc(item.reason)}</td><td class="path">${esc(item.path)}</td>
        <td>${item.restored_at ? `Restored ${esc(item.restored_at)}` : `<button class="action ghost" data-restore="${item.id}">Restore</button>`}</td></tr>`,
      items => items.forEach(item => {
        const button = el.querySelector(`[data-restore="${item.id}"]`);
        if (button) button.onclick = async () => {
          if (!confirm(`Restore this file to its original path?\n${item.path}`)) return;
          try {
            const result = await post("/api/trash/restore", {deletion_id:item.id});
            toast(`Restored ${result.restored}`); await draw(); await loadStats();
          } catch (e) { toast(e.message, true); }
        };
      }));
    $("#show-restored").onchange = draw;
    await draw();
  },

  async organize(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-plan" data-operation>Preview renames</button>
      <button class="action" id="btn-apply" data-operation style="display:none">Apply (move files)</button>
    </div><p class="hint">No files move during preview. Loose root-level tracks go to Singles/Genre.</p>
    <div id="ren-summary"></div><div class="row" id="ren-sections"></div>
    <div id="ren-out"><div class="empty">Preview shows every file move before anything happens.</div></div>`;
    const showPlan = async job => {
      const res = job.summary;
      $("#btn-apply").style.display = !res.applied && res.to_move ? "" : "none";
      $("#ren-summary").textContent = `${res.to_move} planned · ${res.moved} moved · ${res.already_ok} already organized · ${res.skipped} skipped · ${res.errors} errors`;
      $("#ren-sections").innerHTML = ["moves", "skipped_files", "errors"].map(section =>
        `<button class="action ghost" data-section="${section}">${esc(section)}</button>`).join("");
      el.querySelectorAll("[data-section]").forEach(button => button.onclick = () => {
        const section = button.dataset.section;
        pagedTable($("#ren-out"), offset => api(`/api/jobs/${job.id}/results/${section}?offset=${offset}`),
          section === "moves" ? ["From", "To", "Status"] : ["File", "Reason"],
          item => section === "moves" ? `<tr><td class="path">${esc(item.source)}</td><td class="path">${esc(item.target)}</td><td>${esc(item.status)}</td></tr>` :
            `<tr><td class="path">${esc(item.path || item[0])}</td><td>${esc(item.reason || item[1])}</td></tr>`);
      });
      el.querySelector("[data-section]").click();
    };
    $("#btn-plan").onclick = async () => {
      const job = await runTask("rename", {});
      if (el.isConnected) await showPlan(job);
    };
    $("#btn-apply").onclick = async () => {
      if (!confirm("Move and rename files into the organized structure?")) return;
      const job = await runTask("rename", { apply: true });
      if (el.isConnected) await showPlan(job);
      await loadStats();
    };
    const previous = latestJob("rename");
    if (previous) await showPlan(previous);
  },

      <button class="action" id="btn-missing">Find missing art</button>
      <button class="action" id="btn-dl" style="display:none">Download & embed</button>

      if (el.isConnected) await showArt(job);

      if (el.isConnected) await showArt(job);

      $("#btn-dl").style.display = !job.summary.applied && job.summary.albums ? "" : "none";

        ["Artist", "Album", "Status", "Details"],
        album => `<tr><td>${esc(album.artist)}</td><td>${esc(album.album)}</td><td>${esc(album.status)}</td><td>${esc(album.detail)}</td></tr>`);

    const previous = latestJob("art");
    if (previous) await showArt(previous);

      <button class="action" id="btn-refresh">Compare with MusicBrainz</button>

  async settings(el) {
    const s = await api("/api/settings");
    const field = (sec, key, label, opts = {}) => {
      const v = s[sec][key];
      const secret = opts.secret;
      const id = `set-${sec}-${key}`;
      if (typeof v === "boolean") {
        return `<label class="hint"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(label)}</label>`;
      }
      return `<label class="hint">${esc(label)}<br><input type="${secret ? "password" : "text"}" id="${id}"
        style="width:100%" value="${secret ? "" : esc(v)}"
        placeholder="${secret && s[sec][key + "_set"] ? "(saved — leave blank to keep)" : ""}"></label>`;
    };
    const idxRow = (i, n) => `<div class="card idx" data-old="${esc(i.name)}" style="margin-bottom:10px">
      <div class="row">
        <input type="text" class="i-name" placeholder="name" value="${esc(i.name)}">
        <input type="text" class="i-url" placeholder="https://indexer.example" style="flex:1" value="${esc(i.url)}">
      </div>
      <div class="row">
        <input type="password" class="i-key" style="flex:1" placeholder="${i.api_key_set ? "(saved — leave blank to keep)" : "API key"}">
        <input type="text" class="i-cat" placeholder="categories" value="${esc(i.categories || "3000")}" style="width:120px">
        <button class="action ghost i-del">Remove</button>
      </div></div>`;
    el.innerHTML = `
      <div class="card"><h3>SABnzbd</h3>
        ${field("sabnzbd", "url", "URL (e.g. http://NAS_IP:8080)")}
        ${field("sabnzbd", "api_key", "API key", { secret: true })}
        ${field("sabnzbd", "complete_dir", "Complete folder (path inside the musiclib container)")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Indexers (newznab)</h3>
        <div id="idx-list">${s.indexers.map(idxRow).join("")}</div>
        <button class="action ghost" id="idx-add">Add indexer</button>
      </div>
      <div class="card" style="margin-top:14px"><h3>MusicBrainz</h3>
        ${field("brainz", "contact", "Contact email (required by MusicBrainz)")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Organize</h3>
        ${field("organize", "template", "Filename template")}
        ${field("organize", "template_multidisc", "Multi-disc template")}
        ${field("organize", "singles_folder", "Root-level singles folder")}
        ${field("organize", "root_singles", "Group loose root tracks by genre (disable to use album templates)")}
        ${field("organize", "cleanup_empty_dirs", "Remove empty folders after moving")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Bad files &amp; duplicates</h3>
        ${field("doctor", "min_bitrate", "Minimum bitrate (kbps)")}
        ${field("doctor", "min_duration", "Minimum duration (seconds)")}
        ${field("doctor", "deep_decode", "Deep decode with ffmpeg")}
        ${field("duplicates", "duration_tolerance", "Duplicate duration tolerance (seconds)")}
        ${field("duplicates", "strategy", "Duplicate strategy (hash | tags | fingerprint)")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Cover art</h3>
        ${field("artwork", "embed", "Embed art in files")}
        ${field("artwork", "folder_image", "Folder image filename")}
        ${field("artwork", "min_side", "Minimum image side (px)")}
        ${field("artwork", "replace_small", "Replace small art")}
      </div>
      <div class="row" style="margin-top:14px"><button class="action" id="set-save">Save settings</button>
        <span class="hint">Library: ${esc(s.library)} (change via MUSIC_DIR volume mapping)</span></div>`;
    const bindDel = () => el.querySelectorAll(".i-del").forEach(b => b.onclick = () => b.closest(".idx").remove());
    bindDel();
    $("#idx-add").onclick = () => {
      $("#idx-list").insertAdjacentHTML("beforeend", idxRow({ name: "", url: "", categories: "3000" }));
      bindDel();
    };
    const val = (sec, key) => {
      const node = $(`#set-${sec}-${key}`);
      if (!node) return undefined;
      return node.type === "checkbox" ? node.checked : node.value;
    };
    $("#set-save").onclick = async () => {
      const body = { indexers: [...el.querySelectorAll(".idx")].map(r => ({
        old_name: r.dataset.old, name: r.querySelector(".i-name").value,
        url: r.querySelector(".i-url").value, api_key: r.querySelector(".i-key").value,
        categories: r.querySelector(".i-cat").value })) };
      for (const sec of ["sabnzbd", "brainz", "organize", "doctor", "duplicates", "artwork"]) {
        body[sec] = {};
        for (const key of Object.keys(s[sec])) {
          if (key.endsWith("_set")) continue;
          const v = val(sec, key);
          if (v !== undefined) body[sec][key] = v;
        }
      }
      try { await api("/api/settings", { method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
        toast("Settings saved"); render(); } catch (e) { toast(e.message, true); }
    };
  },
};

async function render() {
  try { await loadStats(); } catch (e) { toast(e.message, true); }
  const nav = $("#nav");
  nav.innerHTML = TABS.map(([id, label]) =>
    `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("");
  nav.querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => { state.tab = b.dataset.tab; render(); };
  });
  const main = $("#main");
  main.innerHTML = TABS.map(([id]) => `<section id="tab-${id}" class="${state.tab === id ? "active" : ""}"></section>`).join("");
  const el = $(`#tab-${state.tab}`);
  try { await views[state.tab](el); } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  el.querySelectorAll("button.action:not(.ghost)").forEach(button => { button.dataset.operation = ""; });
  const active = state.jobs.some(j => ["queued", "running"].includes(j.status));
  el.querySelectorAll("[data-operation]").forEach(button => { button.disabled = active; });
}
async function watchActivity() {
  await refreshActivity();
  setTimeout(watchActivity, 1500);
}
async function startDashboard() {
  await refreshActivity();
  await render();
  watchActivity();
}
startDashboard();
</script>
</body>
</html>
