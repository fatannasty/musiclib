<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musiclib</title>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --border: #2a2f3c;
  --text: #e4e7ee; --dim: #8b93a7; --accent: #6c8cff; --green: #3ecf8e;
  --red: #ff6b6b; --yellow: #f5c451; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
header { padding: 18px 24px 12px; border-bottom: 1px solid var(--border); }
h1 { font-size: 20px; font-weight: 600; }
h1 span { color: var(--accent); }
.sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.chip { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; min-width: 110px; }
.chip b { display: block; font-size: 18px; font-family: var(--mono); }
.chip small { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .5px; }
nav { display: flex; gap: 4px; padding: 10px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
nav button { background: none; border: none; color: var(--dim); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
nav button:hover { color: var(--text); background: var(--panel); }
nav button.active { color: var(--text); background: var(--panel2); }
main { padding: 20px 24px; max-width: 1180px; margin: 0 auto; }
section { display: none; }
section.active { display: block; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
button.action { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
button.action:hover { filter: brightness(1.1); }
button.action.danger { background: var(--red); }
button.action.ghost { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
input[type=text], input[type=search] { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; min-width: 320px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel2); }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.mono { font-family: var(--mono); font-size: 12px; }
td.path { font-family: var(--mono); font-size: 11.5px; color: var(--dim); word-break: break-all; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; }
.tag.ok { background: rgba(62,207,142,.15); color: var(--green); }
.tag.bad { background: rgba(255,107,107,.15); color: var(--red); }
.tag.warn { background: rgba(245,196,81,.15); color: var(--yellow); }
.tag.dim { background: rgba(139,147,167,.15); color: var(--dim); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card h3 { font-size: 14px; margin-bottom: 6px; }
.card p { color: var(--dim); font-size: 13px; }
.empty { color: var(--dim); padding: 30px; text-align: center; }
#toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border); padding: 12px 18px; border-radius: 10px; display: none; max-width: 420px; z-index: 99; }
#toast.err { border-color: var(--red); }
.group { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.group .head { background: var(--panel2); padding: 8px 12px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.group table { border: none; border-radius: 0; }
label.check { color: var(--dim); font-size: 13px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
select { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; }
.hint { color: var(--dim); font-size: 12px; }
.keep-flag { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>music<span>lib</span></h1>
  <div class="sub" id="dbpath">dashboard</div>
  <div class="chips" id="chips"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>
<script>
const TABS = [
  ["overview", "Overview"], ["dupes", "Duplicates"], ["doctor", "Bad Files"],
  ["organize", "Organize"], ["art", "Cover Art"], ["missing", "Missing Music"],
  ["usenet", "Usenet"], ["settings", "Settings"],
];
const state = { tab: "overview" };
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes = (b) => {
  if (b == null) return "-";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (b >= 1024 && i < 4) { b /= 1024; i++; }
  return b.toFixed(1) + u[i];
};
const fmtDur = (s) => {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? `${h}h ${m}m` : `${m}m`;
};
function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000);
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}
async function post(path, body) {
  return api(path, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {}) });
}
async function pollJob(id, label) {
  toast(`${label}: running...`);
  while (true) {
    const job = await api(`/api/jobs/${id}`);
    if (job.status === "done") { toast(`${label}: done`); return job.result; }
    if (job.status === "error") { toast(`${label}: ${job.result.error}`, true); return null; }
    await new Promise(r => setTimeout(r, 1500));
  }
}

async function loadStats() {
  const s = await api("/api/stats");
  const chips = [
    [s.tracks.toLocaleString(), "tracks"], [s.albums.toLocaleString(), "albums"],
    [fmtBytes(s.bytes), "size"], [fmtDur(s.duration_seconds), "duration"],
    [s.dupe_groups, "dupe groups"], [s.issues, "issues"],
    [s.albums_missing_art, "missing art"], [s.albums_missing_tracks, "incomplete albums"],
  ];
  $("#chips").innerHTML = chips.map(([v, l]) => `<div class="chip"><b>${esc(v)}</b><small>${l}</small></div>`).join("");
  return s;
}

const views = {
  async overview(el) {
    el.innerHTML = `
      <div class="row">
        <button class="action" id="btn-scan">Scan library</button>
        <button class="action ghost" id="btn-refresh">Refresh stats</button>
      </div>
      <div class="card"><h3>Recommended workflow</h3>
        <p>1. Scan &nbsp;→&nbsp; 2. Bad files &nbsp;→&nbsp; 3. Duplicates &nbsp;→&nbsp; 4. Organize &nbsp;→&nbsp; 5. Cover art &nbsp;→&nbsp; 6. Missing music &nbsp;→&nbsp; 7. Fetch via Usenet.
        Destructive actions ask for confirmation and default to trash (recoverable).</p></div>
      <div id="overview-lists"></div>`;
    $("#btn-scan").onclick = async () => {
      const { job_id } = await post("/api/scan");
      await pollJob(job_id, "Scan");
      await render();
    };
    $("#btn-refresh").onclick = render;
    const issues = await api("/api/issues");
    const lists = $("#overview-lists");
    if (!issues.length) { lists.innerHTML = `<div class="empty">No issues. Library looks clean.</div>`; return; }
    lists.innerHTML = `<table><thead><tr><th>severity</th><th>kind</th><th>file</th></tr></thead><tbody>` +
      issues.slice(0, 50).map(i => `<tr><td><span class="tag ${i.severity}">${esc(i.severity)}</span></td><td>${esc(i.kind)}</td><td class="path">${esc(i.path)}</td></tr>`).join("") +
      `</tbody></table>`;
  },

  async dupes(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-find">Find duplicates</button>
      <button class="action danger" id="btn-apply" style="display:none">Remove losers (trash)</button>
      <span class="hint">Best version per group is kept; losers move to trash. Click a "keep" flag to change the keeper.</span>
    </div><div id="dupe-list"><div class="empty">Click "Find duplicates" to analyze.</div></div>`;
    let data = [];
    $("#btn-find").onclick = async () => {
      data = await api("/api/dupes");
      if (!data.length) { $("#dupe-list").innerHTML = `<div class="empty">No duplicates found.</div>`; return; }
      $("#btn-apply").style.display = "";
      $("#dupe-list").innerHTML = data.map(g => {
        const keep = g.members.find(m => m.id === g.keep_id);
        return `<div class="group" data-gid="${g.group_id}">
          <div class="head"><span>${esc(keep?.artist || "")} — ${esc(keep?.album || "")} · ${esc(keep?.title || "")}</span>
          <span class="tag warn">${g.members.length} copies</span></div>
          <table><tbody>${g.members.map(m => `
            <tr><td style="width:60px">${m.id === g.keep_id ? `<span class="keep-flag" data-keep="${g.group_id}:${m.id}" style="cursor:pointer">● keep</span>` : `<span data-keep="${g.group_id}:${m.id}" style="cursor:pointer;color:var(--dim)">○</span>`}</td>
            <td class="mono">${esc(m.format || "?")} ${m.bitrate || ""}${m.bit_depth ? "/" + m.bit_depth + "bit" : ""}</td>
            <td class="mono" style="width:70px">${esc(m.quality_score ?? 0)}</td>
            <td class="path">${esc(m.path)}</td></tr>`).join("")}</tbody></table></div>`;
      }).join("");
      el.querySelectorAll("[data-keep]").forEach(node => {
        node.onclick = () => {
          const [gid, tid] = node.dataset.keep.split(":").map(Number);
          const g = data.find(x => x.group_id === gid);
          if (g) { g.keep_id = tid; $("#btn-find").click(); }
        };
      });
    };
    $("#btn-apply").onclick = async () => {
      if (!confirm(`Remove duplicate files (move to trash)? This affects ${data.length} groups.`)) return;
      const keepIds = {};
      data.forEach(g => { keepIds[g.group_id] = g.keep_id; });
      const res = await post("/api/dupes/apply", { keep_ids: keepIds, hard_delete: false });
      toast(`Trashed ${res.trashed}, reclaimed ${fmtBytes(res.reclaimed_bytes)}`);
      $("#btn-find").click();
      loadStats();
    };
  },

  async doctor(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-check">Check files</button>
      <button class="action danger" id="btn-remove" style="display:none">Trash bad files</button>
      <label class="check"><input type="checkbox" id="opt-deep" checked> deep decode (ffmpeg)</label>
    </div><div id="doc-out"><div class="empty">Run a check to find broken files.</div></div>`;
    let lastBad = 0;
    $("#btn-check").onclick = async () => {
      toast("Checking library...");
      const res = await post("/api/doctor", { deep: $("#opt-deep").checked });
      lastBad = res.bad;
      $("#btn-remove").style.display = res.bad ? "" : "none";
      if (!res.results.length) { $("#doc-out").innerHTML = `<div class="empty">No problems found.</div>`; return; }
      $("#doc-out").innerHTML = `<table><thead><tr><th>severity</th><th>issues</th><th>file</th></tr></thead><tbody>` +
        res.results.map(r => `<tr><td><span class="tag ${r.severity}">${esc(r.severity)}</span></td><td>${r.issues.map(esc).join(", ")}</td><td class="path">${esc(r.path)}</td></tr>`).join("") +
        `</tbody></table><p class="hint">${res.checked} checked · ${res.bad} bad · ${res.suspect} suspect</p>`;
    };
    $("#btn-remove").onclick = async () => {
      if (!confirm(`Move ${lastBad} bad files to trash?`)) return;
      const res = await post("/api/doctor", { apply: true, hard_delete: false, deep: false });
      toast(`Trashed ${res.trashed} bad files`);
      $("#btn-check").click();
      loadStats();
    };
  },

  async organize(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-plan">Preview renames</button>
      <button class="action" id="btn-apply" style="display:none">Apply (move files)</button>
    </div><div id="ren-out"><div class="empty">Preview shows every file move before anything happens.</div></div>`;
    $("#btn-plan").onclick = async () => {
      const res = await post("/api/rename", {});
      $("#btn-apply").style.display = res.to_move ? "" : "none";
      if (!res.to_move && !res.skipped) { $("#ren-out").innerHTML = `<div class="empty">Everything is already organized.</div>`; return; }
      $("#ren-out").innerHTML = `<table><thead><tr><th>from</th><th>to</th></tr></thead><tbody>` +
        res.moves.map(m => `<tr><td class="path">${esc(m.source)}</td><td class="path" style="color:var(--green)">${esc(m.target)}</td></tr>`).join("") +
        `</tbody></table><p class="hint">${res.to_move} to move · ${res.already_ok} already organized · ${res.skipped} skipped (missing tags)</p>`;
    };
    $("#btn-apply").onclick = async () => {
      if (!confirm("Move and rename files into the organized structure?")) return;
      const res = await post("/api/rename", { apply: true });
      toast(`Moved ${res.moved} files${res.errors?.length ? `, ${res.errors.length} errors` : ""}`);
      $("#btn-plan").click();
      loadStats();
    };
  },

  async art(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-missing">Find missing art</button>
      <button class="action" id="btn-dl" style="display:none">Download & embed</button>
    </div><div id="art-out"><div class="empty">Art comes from the Cover Art Archive (MusicBrainz).</div></div>`;
    $("#btn-missing").onclick = async () => {
      const res = await post("/api/art", {});
      $("#btn-dl").style.display = res.albums?.length ? "" : "none";
      if (!res.albums?.length) { $("#art-out").innerHTML = `<div class="empty">All albums have art.</div>`; return; }
      $("#art-out").innerHTML = `<table><thead><tr><th>artist</th><th>album</th><th>status</th></tr></thead><tbody>` +
        res.albums.map(a => `<tr><td>${esc(a.artist)}</td><td>${esc(a.album)}</td><td><span class="tag warn">${esc(a.status)}</span></td></tr>`).join("") + `</tbody></table>`;
    };
    $("#btn-dl").onclick = async () => {
      toast("Downloading artwork...");
      const res = await post("/api/art", { apply: true });
      const ok = res.albums.filter(a => a.status === "downloaded").length;
      toast(`Downloaded art for ${ok}/${res.albums.length} albums`);
      loadStats();
    };
  },

  async missing(el) {
    el.innerHTML = `<div class="row">
      <button class="action" id="btn-refresh">Compare with MusicBrainz</button>
      <span class="hint">Detects tracks your albums are missing, then fetch them from Usenet.</span>
    </div><div id="miss-out"><div class="empty">Run a comparison to find gaps in your albums.</div></div>`;
    $("#btn-refresh").onclick = async () => {
      const { job_id } = await post("/api/brainz/refresh");
      await pollJob(job_id, "MusicBrainz");
      const gaps = await api("/api/missing");
      if (!gaps.length) { $("#miss-out").innerHTML = `<div class="empty">No missing tracks detected.</div>`; return; }
      $("#miss-out").innerHTML = `<table><thead><tr><th>artist</th><th>album</th><th>missing tracks</th><th></th></tr></thead><tbody>` +
        gaps.map(g => `<tr><td>${esc(g.artist)}</td><td>${esc(g.album)}</td><td>${g.missing.map(esc).join("<br>")}</td>
        <td><button class="action ghost" data-q="${esc(g.artist + " - " + g.album)}">Fetch via Usenet</button></td></tr>`).join("") + `</tbody></table>`;
      el.querySelectorAll("[data-q]").forEach(btn => {
        btn.onclick = () => { state.tab = "usenet"; render(); $("#usenet-q").value = btn.dataset.q; $("#btn-usearch").click(); };
      });
      loadStats();
    };
  },

  async usenet(el) {
    el.innerHTML = `<div class="row">
      <input type="text" id="usenet-q" placeholder="artist - album">
      <button class="action" id="btn-usearch">Search indexers</button>
    </div>
    <div class="row"><div class="card" style="flex:1"><h3>SABnzbd queue</h3><div id="sab-queue" class="hint">—</div></div></div>
    <div id="usearch-out"><div class="empty">Search your newznab indexers for music to download.</div></div>`;
    const loadQueue = async () => {
      try {
        const q = await api("/api/sab/queue");
        $("#sab-queue").innerHTML = q.length
          ? `<table><tbody>${q.map(s => `<tr><td>${esc(s.filename || s.title || "?")}</td><td class="mono">${esc(s.status || "")}</td><td class="mono">${esc(s.sizeleft || "")}</td></tr>`).join("")}</tbody></table>`
          : "Queue is empty.";
      } catch (e) { $("#sab-queue").textContent = e.message; }
    };
    loadQueue();
    $("#btn-usearch").onclick = async () => {
      const q = $("#usenet-q").value.trim();
      if (!q) return;
      try {
        const results = await post("/api/search", { query: q });
        if (!results.length) { $("#usearch-out").innerHTML = `<div class="empty">No results from your indexers.</div>`; return; }
        $("#usearch-out").innerHTML = `<table><thead><tr><th>score</th><th>size</th><th>title</th><th>indexer</th><th></th></tr></thead><tbody>` +
          results.map(r => `<tr><td class="mono">${esc(r.score)}</td><td class="mono">${fmtBytes(r.size)}</td><td>${esc(r.title)}</td><td class="hint">${esc(r.indexer)}</td>
          <td><button class="action" data-url="${esc(r.url)}" data-name="${esc(r.title)}">Send to SABnzbd</button></td></tr>`).join("") + `</tbody></table>`;
        el.querySelectorAll("[data-url]").forEach(btn => {
          btn.onclick = async () => {
            try {
              const res = await post("/api/sab/add", { url: btn.dataset.url, name: btn.dataset.name });
              toast(`Queued as ${res.nzo_id}`);
              loadQueue();
            } catch (e) { toast(e.message, true); }
          };
        });
      } catch (e) { toast(e.message, true); }
    };
  },

  async settings(el) {
    const s = await api("/api/settings");
    const field = (sec, key, label, opts = {}) => {
      const v = s[sec][key];
      const secret = opts.secret;
      const id = `set-${sec}-${key}`;
      if (typeof v === "boolean") {
        return `<label class="hint"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(label)}</label>`;
      }
      return `<label class="hint">${esc(label)}<br><input type="${secret ? "password" : "text"}" id="${id}"
        style="width:100%" value="${secret ? "" : esc(v)}"
        placeholder="${secret && s[sec][key + "_set"] ? "(saved — leave blank to keep)" : ""}"></label>`;
    };
    const idxRow = (i, n) => `<div class="card idx" data-old="${esc(i.name)}" style="margin-bottom:10px">
      <div class="row">
        <input type="text" class="i-name" placeholder="name" value="${esc(i.name)}">
        <input type="text" class="i-url" placeholder="https://indexer.example" style="flex:1" value="${esc(i.url)}">
      </div>
      <div class="row">
        <input type="password" class="i-key" style="flex:1" placeholder="${i.api_key_set ? "(saved — leave blank to keep)" : "API key"}">
        <input type="text" class="i-cat" placeholder="categories" value="${esc(i.categories || "3000")}" style="width:120px">
        <button class="action ghost i-del">Remove</button>
      </div></div>`;
    el.innerHTML = `
      <div class="card"><h3>SABnzbd</h3>
        ${field("sabnzbd", "url", "URL (e.g. http://NAS_IP:8080)")}
        ${field("sabnzbd", "api_key", "API key", { secret: true })}
        ${field("sabnzbd", "complete_dir", "Complete folder (path inside the musiclib container)")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Indexers (newznab)</h3>
        <div id="idx-list">${s.indexers.map(idxRow).join("")}</div>
        <button class="action ghost" id="idx-add">Add indexer</button>
      </div>
      <div class="card" style="margin-top:14px"><h3>MusicBrainz</h3>
        ${field("brainz", "contact", "Contact email (required by MusicBrainz)")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Organize</h3>
        ${field("organize", "template", "Filename template")}
        ${field("organize", "template_multidisc", "Multi-disc template")}
        ${field("organize", "cleanup_empty_dirs", "Remove empty folders after moving")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Bad files &amp; duplicates</h3>
        ${field("doctor", "min_bitrate", "Minimum bitrate (kbps)")}
        ${field("doctor", "min_duration", "Minimum duration (seconds)")}
        ${field("doctor", "deep_decode", "Deep decode with ffmpeg")}
        ${field("duplicates", "duration_tolerance", "Duplicate duration tolerance (seconds)")}
        ${field("duplicates", "strategy", "Duplicate strategy (hash | tags | fingerprint)")}
      </div>
      <div class="card" style="margin-top:14px"><h3>Cover art</h3>
        ${field("artwork", "embed", "Embed art in files")}
        ${field("artwork", "folder_image", "Folder image filename")}
        ${field("artwork", "min_side", "Minimum image side (px)")}
        ${field("artwork", "replace_small", "Replace small art")}
      </div>
      <div class="row" style="margin-top:14px"><button class="action" id="set-save">Save settings</button>
        <span class="hint">Library: ${esc(s.library)} (change via MUSIC_DIR volume mapping)</span></div>`;
    const bindDel = () => el.querySelectorAll(".i-del").forEach(b => b.onclick = () => b.closest(".idx").remove());
    bindDel();
    $("#idx-add").onclick = () => {
      $("#idx-list").insertAdjacentHTML("beforeend", idxRow({ name: "", url: "", categories: "3000" }));
      bindDel();
    };
    const val = (sec, key) => {
      const node = $(`#set-${sec}-${key}`);
      if (!node) return undefined;
      return node.type === "checkbox" ? node.checked : node.value;
    };
    $("#set-save").onclick = async () => {
      const body = { indexers: [...el.querySelectorAll(".idx")].map(r => ({
        old_name: r.dataset.old, name: r.querySelector(".i-name").value,
        url: r.querySelector(".i-url").value, api_key: r.querySelector(".i-key").value,
        categories: r.querySelector(".i-cat").value })) };
      for (const sec of ["sabnzbd", "brainz", "organize", "doctor", "duplicates", "artwork"]) {
        body[sec] = {};
        for (const key of Object.keys(s[sec])) {
          if (key.endsWith("_set")) continue;
          const v = val(sec, key);
          if (v !== undefined) body[sec][key] = v;
        }
      }
      try { await api("/api/settings", { method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
        toast("Settings saved"); render(); } catch (e) { toast(e.message, true); }
    };
  },
};

async function render() {
  try { await loadStats(); } catch (e) { toast(e.message, true); }
  const nav = $("#nav");
  nav.innerHTML = TABS.map(([id, label]) =>
    `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("");
  nav.querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => { state.tab = b.dataset.tab; render(); };
  });
  const main = $("#main");
  main.innerHTML = TABS.map(([id]) => `<section id="tab-${id}" class="${state.tab === id ? "active" : ""}"></section>`).join("");
  const el = $(`#tab-${state.tab}`);
  try { await views[state.tab](el); } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
render();
</script>
</body>
</html>
